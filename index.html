<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Interactive 6.0 Studio</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0a0e;
      --panel: #14141d;
      --accent: #e50914;
      --accent-hover: #ff1e27;
      --text: #ffffff;
      --text-dim: #8a8a9e;
      --border: #232334;
      --glass: rgba(18, 18, 26, 0.88);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; user-select: none; }
    body { background: var(--bg); color: var(--text); overflow-x: hidden; }

    /* HEADER */
    header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 18px 40px; background: rgba(10, 10, 14, 0.85); backdrop-filter: blur(12px);
      position: fixed; top: 0; width: 100%; z-index: 100; border-bottom: 1px solid var(--border);
    }
    .logo { font-size: 24px; font-weight: 900; color: var(--accent); letter-spacing: 2px; }
    .header-btns { display: flex; gap: 12px; align-items: center; }
    
    .user-badge {
      display: flex; align-items: center; gap: 10px; background: var(--panel);
      padding: 6px 14px; border-radius: 20px; border: 1px solid var(--border); cursor: pointer;
    }
    .user-badge img { width: 28px; height: 28px; border-radius: 50%; object-fit: cover; }
    .user-badge span { font-weight: 600; font-size: 13px; }

    .btn {
      background: var(--panel); color: #fff; border: 1px solid var(--border); padding: 10px 18px;
      border-radius: 6px; font-weight: 600; cursor: pointer; transition: 0.2s; font-size: 13px;
    }
    .btn:hover { background: #1e1e2c; border-color: #3b3b54; }
    .btn-accent { background: var(--accent); border: none; }
    .btn-accent:hover { background: var(--accent-hover); }
    .btn-danger { background: #900; border: none; }
    .btn-danger:hover { background: #c00; }
    .btn-sm { padding: 4px 8px; font-size: 11px; }

    /* GRID & CARDS */
    .container { padding: 110px 40px 40px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 24px; }
    .card {
      background: var(--panel); border-radius: 10px; overflow: hidden; border: 1px solid var(--border);
      cursor: pointer; transition: transform 0.3s, border-color 0.3s, box-shadow 0.3s; position: relative;
    }
    .card:hover { transform: translateY(-6px); border-color: var(--accent); box-shadow: 0 12px 30px rgba(229, 9, 20, 0.25); }
    .card img { width: 100%; height: 320px; object-fit: cover; }
    .card-body { padding: 15px; }
    .card-title { font-weight: 700; font-size: 16px; margin-bottom: 4px; }
    .card-meta { font-size: 12px; color: var(--text-dim); }
    
    .resume-tag {
      position: absolute; top: 10px; right: 10px; background: var(--accent);
      color: #fff; font-size: 10px; font-weight: 800; padding: 4px 8px; border-radius: 4px; text-transform: uppercase;
    }

    /* USER SELECT SCREEN */
    .user-screen {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: var(--bg); z-index: 500; display: flex; flex-direction: column;
      justify-content: center; align-items: center; gap: 30px;
    }
    .user-profiles { display: flex; gap: 24px; flex-wrap: wrap; justify-content: center; }
    .profile-card {
      display: flex; flex-direction: column; align-items: center; gap: 12px;
      cursor: pointer; transition: transform 0.2s; position: relative;
    }
    .profile-card:hover { transform: scale(1.08); }
    .profile-avatar {
      width: 110px; height: 110px; border-radius: 12px; object-fit: cover;
      border: 3px solid transparent; transition: border-color 0.2s;
    }
    .profile-card:hover .profile-avatar { border-color: var(--accent); }
    .profile-name { font-weight: 700; font-size: 16px; color: var(--text-dim); }
    .profile-edit-btn {
      position: absolute; top: -5px; right: -5px; background: var(--panel); border: 1px solid var(--border);
      border-radius: 50%; width: 28px; height: 28px; display: flex; align-items: center; justify-content: center;
      font-size: 12px; color: #fff; transition: 0.2s;
    }
    .profile-edit-btn:hover { background: var(--accent); border-color: var(--accent); }

    /* MODALS */
    .modal {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85); backdrop-filter: blur(6px); z-index: 600;
      justify-content: center; align-items: center;
    }
    .modal-content {
      background: var(--panel); width: 700px; max-height: 88vh; overflow-y: auto;
      padding: 30px; border-radius: 12px; border: 1px solid var(--border); position: relative;
    }
    .close-btn { position: absolute; top: 20px; right: 25px; font-size: 26px; cursor: pointer; color: var(--text-dim); }
    
    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-size: 12px; color: var(--text-dim); margin-bottom: 6px; text-transform: uppercase; }
    input, select {
      width: 100%; padding: 10px; background: #0c0c12; border: 1px solid var(--border);
      border-radius: 6px; color: #fff; font-size: 13px; outline: none; transition: 0.2s;
    }
    input:focus { border-color: var(--accent); }

    /* SAHNE BLOĞU & KARAR EKLEME ALANI */
    .easy-scene-box {
      background: #0d0d14; border: 1px dashed var(--border); border-radius: 8px;
      padding: 16px; margin-bottom: 16px; position: relative;
    }
    .row { display: flex; gap: 10px; margin-top: 8px; align-items: center; }

    .choices-builder {
      background: #151522; padding: 12px; border-radius: 6px; border: 1px solid #28283d; margin-top: 10px;
    }
    .choice-row { display: flex; gap: 8px; margin-bottom: 8px; align-items: center; }

    /* ADVANCED PLAYER SYSTEM */
    #player-container { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #000; z-index: 300; }
    
    .v-player { width: 100%; height: 100%; object-fit: contain; position: absolute; top: 0; left: 0; }

    .player-overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 310;
      display: flex; flex-direction: column; justify-content: space-between;
      background: linear-gradient(to bottom, rgba(0,0,0,0.7) 0%, transparent 20%, transparent 70%, rgba(0,0,0,0.9) 100%);
      opacity: 0; transition: opacity 0.3s;
    }
    #player-container:hover .player-overlay, .player-overlay.force-show { opacity: 1; }

    .top-bar { display: flex; justify-content: space-between; align-items: center; padding: 20px 30px; }
    .top-title { font-weight: 800; font-size: 18px; letter-spacing: 0.5px; }

    .bottom-bar { padding: 15px 30px 25px; display: flex; flex-direction: column; gap: 12px; }

    /* SEEKBAR */
    .seekbar-container { width: 100%; display: flex; align-items: center; gap: 12px; }
    .seekbar {
      flex: 1; -webkit-appearance: none; appearance: none; height: 5px; background: rgba(255,255,255,0.3);
      border-radius: 3px; outline: none; cursor: pointer; transition: height 0.1s;
    }
    .seekbar:hover { height: 8px; }
    .seekbar::-webkit-slider-thumb {
      -webkit-appearance: none; appearance: none; width: 14px; height: 14px;
      border-radius: 50%; background: var(--accent); cursor: pointer;
    }
    .time-display { font-size: 13px; font-weight: 600; color: #ddd; min-width: 90px; }

    /* CONTROLS */
    .controls-row { display: flex; justify-content: space-between; align-items: center; }
    .controls-left, .controls-right { display: flex; align-items: center; gap: 16px; }

    .p-btn {
      background: none; border: none; color: #fff; font-size: 18px; cursor: pointer;
      opacity: 0.85; transition: 0.2s; display: flex; align-items: center; justify-content: center;
    }
    .p-btn:hover { opacity: 1; transform: scale(1.1); color: var(--accent); }

    .volume-box { display: flex; align-items: center; gap: 8px; }
    .volume-slider { width: 70px; -webkit-appearance: none; height: 4px; background: rgba(255,255,255,0.3); border-radius: 2px; }
    .volume-slider::-webkit-slider-thumb { -webkit-appearance: none; width: 10px; height: 10px; border-radius: 50%; background: #fff; }

    .p-select { background: rgba(0,0,0,0.6); border: 1px solid rgba(255,255,255,0.2); color: #fff; padding: 4px 8px; border-radius: 4px; font-size: 12px; cursor: pointer; }

    /* CHOICES OVERLAY */
    .choices-container {
      position: absolute; bottom: 130px; left: 50%; transform: translateX(-50%);
      display: flex; flex-direction: column; align-items: center; gap: 14px;
      z-index: 330; opacity: 0; pointer-events: none; transition: opacity 0.3s; width: 80%; max-width: 600px;
    }
    .choices-container.active { opacity: 1; pointer-events: auto; }
    .timer-bar-wrapper { width: 100%; height: 5px; background: rgba(255,255,255,0.2); border-radius: 3px; overflow: hidden; }
    .timer-bar-fill { height: 100%; width: 100%; background: var(--accent); }

    .choices-buttons { display: flex; gap: 16px; width: 100%; justify-content: center; }
    .choice-card {
      flex: 1; background: var(--glass); border: 2px solid rgba(255,255,255,0.2);
      color: #fff; padding: 16px; border-radius: 10px; font-size: 16px; font-weight: 700;
      cursor: pointer; backdrop-filter: blur(10px); text-align: center; transition: 0.2s;
    }
    .choice-card:hover { border-color: var(--accent); background: var(--accent); transform: translateY(-3px); }

    /* TREE MAP MODAL */
    .tree-modal {
      display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(10, 10, 15, 0.94); backdrop-filter: blur(10px); z-index: 340; padding: 50px;
    }
    .tree-path { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 20px; }
    .tree-node { background: var(--panel); border: 1px solid var(--border); padding: 14px 20px; border-radius: 8px; cursor: pointer; }
    .tree-node:hover { border-color: var(--accent); }
  </style>
</head>
<body>

  <div class="user-screen" id="user-screen">
    <h1 style="font-weight: 900;">Kim İzliyor?</h1>
    <div class="user-profiles" id="user-profiles-list"></div>
    <button class="btn btn-accent" onclick="openNewUserModal()">+ Yeni Profil Ekle</button>
  </div>

  <header>
    <div class="logo">The Interactive</div>
    <div class="header-btns">
      <div class="user-badge" onclick="showUserScreen()">
        <img src="" id="header-avatar" alt="User">
        <span id="header-username">Kullanıcı</span>
      </div>
      <button class="btn" onclick="exportData()">💾 Dışa Aktar</button>
      <button class="btn" onclick="triggerImport()">📂 İçe Aktar</button>
      <input type="file" id="import-file" style="display:none;" onchange="importData(event)" accept=".json">
      <button class="btn btn-accent" onclick="openAdmin()">+ Film & Karar Ekle</button>
    </div>
  </header>

  <div class="container">
    <h2 style="margin-bottom: 20px;">İnteraktif Kütüphane</h2>
    <div class="grid" id="movie-grid"></div>
  </div>

  <div class="modal" id="user-modal">
    <div class="modal-content" style="max-width: 400px;">
      <span class="close-btn" onclick="closeUserModal()">&times;</span>
      <h2 id="user-modal-title">Yeni Profil</h2><br>
      <div class="form-group"><label>Profil Adı</label><input type="text" id="u-name" placeholder="Ahmet"></div>
      <div class="form-group"><label>Avatar URL</label><input type="text" id="u-avatar-url" placeholder="https://..."></div>
      <button class="btn btn-accent" style="width:100%; padding:12px;" onclick="saveUser()">Profili Kaydet</button>
    </div>
  </div>

  <div class="modal" id="admin-modal">
    <div class="modal-content">
      <span class="close-btn" onclick="closeAdmin()">&times;</span>
      <h2>İnteraktif Film Oluşturucu</h2>
      <p style="color:var(--text-dim); font-size:13px; margin-bottom:15px;">Sahne ekleyin, karar zamanını (saniyesini) ve yönlendirmeleri belirleyin.</p>
      
      <div class="form-group"><label>Film Adı</label><input type="text" id="m-title" placeholder="Örn: Kaçış Günü"></div>
      <div class="form-group"><label>Afiş Görsel URL</label><input type="text" id="m-poster" placeholder="https://..."></div>
      
      <hr style="border-color:var(--border); margin:15px 0;">
      <h3 style="margin-bottom:10px; font-size:15px;">Sahneler ve Karar Anları</h3>
      <div id="scenes-container"></div>
      
      <button class="btn" style="width:100%; margin-bottom:10px;" onclick="addSceneBlock()">+ Yeni Sahne Bloğu Ekle</button>
      <button class="btn btn-accent" style="width:100%; padding:14px;" onclick="saveMovie()">Filmi Kaydet ve Yayınla</button>
    </div>
  </div>

  <div id="player-container">
    <video id="v-player" class="v-player" playsinline></video>

    <div class="player-overlay" id="player-overlay">
      <div class="top-bar">
        <div class="top-title" id="player-title">Film Adı</div>
        <div style="display:flex; gap:10px;">
          <button class="btn" style="padding:6px 12px;" onclick="openTreeMap()">🌐 Karar Haritası</button>
          <button class="btn btn-danger" style="padding:6px 12px;" onclick="closePlayer()">✕ Çıkış</button>
        </div>
      </div>

      <div class="bottom-bar">
        <div class="seekbar-container">
          <span class="time-display" id="time-curr">00:00</span>
          <input type="range" class="seekbar" id="seekbar" min="0" max="100" value="0" step="0.1" oninput="onSeek(this.value)">
          <span class="time-display" id="time-dur">00:00</span>
        </div>

        <div class="controls-row">
          <div class="controls-left">
            <button class="p-btn" id="play-btn" onclick="togglePlay()">▶</button>
            <button class="p-btn" onclick="seekRelative(-10)">↺ 10s</button>
            <button class="p-btn" onclick="seekRelative(10)">↻ 10s</button>
            
            <div class="volume-box">
              <button class="p-btn" id="mute-btn" onclick="toggleMute()">🔊</button>
              <input type="range" class="volume-slider" id="volume-slider" min="0" max="1" step="0.05" value="1" oninput="changeVolume(this.value)">
            </div>
          </div>

          <div class="controls-right">
            <select class="p-select" id="speed-select" onchange="changeSpeed(this.value)">
              <option value="0.5">0.5x</option>
              <option value="1" selected>1.0x (Normal)</option>
              <option value="1.25">1.25x</option>
              <option value="1.5">1.5x</option>
              <option value="2">2.0x</option>
            </select>

            <select class="p-select" id="quality-select">
              <option value="auto">Kalite: Otomatik</option>
              <option value="1080">1080p</option>
              <option value="720">720p</option>
              <option value="480">480p</option>
            </select>

            <select class="p-select" id="audio-select"><option value="">Ses: Türkçe</option></select>
            <select class="p-select" id="sub-select" onchange="changeSub(this.value)"><option value="">Altyazı: Kapalı</option></select>

            <button class="p-btn" onclick="toggleFullscreen()">⛶</button>
          </div>
        </div>
      </div>
    </div>

    <div class="choices-container" id="choices-box">
      <div class="timer-bar-wrapper"><div class="timer-bar-fill" id="timer-bar"></div></div>
      <div class="choices-buttons" id="choices-btn-group"></div>
    </div>

    <div class="tree-modal" id="tree-modal">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <h2>Karar Geçmişiniz</h2>
        <button class="btn" onclick="closeTreeMap()">Kapat</button>
      </div>
      <div class="tree-path" id="tree-path-list"></div>
    </div>
  </div>

  <script>
    // VERİ DEPOLAMA
    let movies = JSON.parse(localStorage.getItem('the_interactive_v6')) || [];
    let users = JSON.parse(localStorage.getItem('the_interactive_users')) || [
      { id: 'u_1', name: 'İzleyici', avatar: 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=150', progress: {} }
    ];
    let activeUserId = localStorage.getItem('the_interactive_active_user') || users[0].id;
    let editingUserId = null;

    let currentMovie = null;
    let historyStack = [];
    let timerInterval = null;
    let currentSceneKey = "";

    const player = document.getElementById('v-player');
    const seekbar = document.getElementById('seekbar');

    // DEMO İÇERİK
    const demoMovie = [{
      title: "Karanlık Yolculuk (Demo)",
      poster: "https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=500",
      startScene: "Başlangıç",
      scenes: {
        "Başlangıç": {
          video: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4",
          decisionTime: 7,
          choices: [
            { text: "Sol Tünele Gir", target: "SolTünel" },
            { text: "Sağ Patikadan Git", target: "SağPatika" }
          ]
        },
        "SolTünel": {
          video: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerEscapes.mp4",
          decisionTime: 5,
          choices: [{ text: "Geri Başlangıca Dön", target: "Başlangıç" }]
        },
        "SağPatika": {
          video: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerFun.mp4",
          decisionTime: 5,
          choices: [{ text: "Geri Başlangıca Dön", target: "Başlangıç" }]
        }
      }
    }];

    window.onload = () => {
      if(movies.length === 0) {
        movies = demoMovie;
        localStorage.setItem('the_interactive_v6', JSON.stringify(movies));
      }
      renderUsers();
      updateHeaderUser();
      renderMovies();
      addSceneBlock("Başlangıç");
    };

    /* KULLANICI */
    function getActiveUser() { return users.find(u => u.id === activeUserId) || users[0]; }
    function renderUsers() {
      const list = document.getElementById('user-profiles-list');
      list.innerHTML = users.map(u => `
        <div class="profile-card">
          <div class="profile-edit-btn" onclick="event.stopPropagation(); openEditUserModal('${u.id}')" title="Profili Düzenle">✏️</div>
          <img class="profile-avatar" src="${u.avatar || 'https://via.placeholder.com/150'}" onclick="selectUser('${u.id}')">
          <div class="profile-name" onclick="selectUser('${u.id}')">${u.name}</div>
        </div>
      `).join('');
    }
    function selectUser(id) {
      activeUserId = id;
      localStorage.setItem('the_interactive_active_user', id);
      updateHeaderUser();
      document.getElementById('user-screen').style.display = 'none';
      renderMovies();
    }
    function updateHeaderUser() {
      const u = getActiveUser();
      document.getElementById('header-username').innerText = u.name;
      document.getElementById('header-avatar').src = u.avatar || 'https://via.placeholder.com/150';
    }
    function showUserScreen() { renderUsers(); document.getElementById('user-screen').style.display = 'flex'; }
    
    function openNewUserModal() {
      editingUserId = null;
      document.getElementById('user-modal-title').innerText = "Yeni Profil";
      document.getElementById('u-name').value = "";
      document.getElementById('u-avatar-url').value = "";
      document.getElementById('user-modal').style.display = 'flex';
    }

    function openEditUserModal(id) {
      editingUserId = id;
      const user = users.find(u => u.id === id);
      if(!user) return;
      document.getElementById('user-modal-title').innerText = "Profili Düzenle";
      document.getElementById('u-name').value = user.name;
      document.getElementById('u-avatar-url').value = user.avatar || "";
      document.getElementById('user-modal').style.display = 'flex';
    }

    function closeUserModal() { 
      editingUserId = null;
      document.getElementById('user-modal').style.display = 'none'; 
    }

    function saveUser() {
      const name = document.getElementById('u-name').value.trim();
      const avatar = document.getElementById('u-avatar-url').value.trim() || "https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=150";
      if(!name) return alert("İsim gerekli");

      if (editingUserId) {
        // Profil Düzenleme Güncellemesi
        const user = users.find(u => u.id === editingUserId);
        if (user) {
          user.name = name;
          user.avatar = avatar;
        }
      } else {
        // Yeni Profil Ekleme
        const u = { id: 'u_' + Date.now(), name, avatar, progress: {} };
        users.push(u);
        editingUserId = u.id;
      }

      localStorage.setItem('the_interactive_users', JSON.stringify(users));
      closeUserModal(); 
      renderUsers();
      updateHeaderUser();
    }

    /* VİTRİN */
    function renderMovies() {
      const grid = document.getElementById('movie-grid');
      const u = getActiveUser();
      grid.innerHTML = movies.map((m, i) => {
        const prog = u.progress && u.progress[m.title];
        return `
          <div class="card" onclick="startMovie(${i})">
            ${prog ? `<div class="resume-tag">Kaldığın Yer: ${prog.sceneKey}</div>` : ''}
            <img src="${m.poster || 'https://via.placeholder.com/300x400'}">
            <div class="card-body">
              <div class="card-title">${m.title}</div>
              <div class="card-meta">${Object.keys(m.scenes || {}).length} Karar Sahnesi</div>
            </div>
          </div>
        `;
      }).join('');
    }

    /* DİNAMİK SAHNE VE KARAR OLUŞTURUCU */
    function openAdmin() { document.getElementById('admin-modal').style.display = 'flex'; }
    function closeAdmin() { document.getElementById('admin-modal').style.display = 'none'; }
    
    let sceneCount = 0;
    function addSceneBlock(defaultName = "") {
      sceneCount++;
      const container = document.getElementById('scenes-container');
      const boxId = 'sc_box_' + Date.now() + Math.random().toString().substr(2,3);
      const name = defaultName || ("Sahne_" + sceneCount);
      
      const html = `
        <div class="easy-scene-box" id="${boxId}">
          <button class="btn btn-danger btn-sm" style="position:absolute; top:10px; right:10px;" onclick="document.getElementById('${boxId}').remove()">Sahneyi Sil</button>
          <div class="row">
            <div style="flex:1;"><label>Sahne Adı (Kimlik)</label><input type="text" class="sc-name" value="${name}"></div>
            <div style="flex:2;"><label>Video URL / Linki</label><input type="text" class="sc-video" placeholder="https://...video.mp4"></div>
          </div>
          <div class="row" style="margin-top:10px;">
            <div style="flex:1;"><label>Karar Ekranı Saniyesi (Örn: 12)</label><input type="number" class="sc-dec-time" placeholder="12"></div>
          </div>
          
          <div class="choices-builder">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
              <span style="font-size:12px; font-weight:700; color:var(--accent);">KARAR BUTONLARI</span>
              <button class="btn btn-sm" onclick="addChoiceRow('${boxId}')">+ Karar Butonu Ekle</button>
            </div>
            <div class="choices-list"></div>
          </div>
        </div>
      `;
      container.insertAdjacentHTML('beforeend', html);
      addChoiceRow(boxId); // Varsayılan 1 buton ekle
    }

    function addChoiceRow(boxId) {
      const box = document.getElementById(boxId);
      const choicesList = box.querySelector('.choices-list');
      const rowId = 'ch_' + Date.now() + Math.random().toString().substr(2,3);
      
      const html = `
        <div class="choice-row" id="${rowId}">
          <input type="text" class="c-btn-text" placeholder="Buton Yazısı (Örn: Kapıyı Aç)">
          <input type="text" class="c-btn-target" placeholder="Hedef Sahne Adı (Örn: Sahne_2)">
          <button class="btn btn-danger btn-sm" onclick="document.getElementById('${rowId}').remove()">✕</button>
        </div>
      `;
      choicesList.insertAdjacentHTML('beforeend', html);
    }

    function saveMovie() {
      const title = document.getElementById('m-title').value.trim();
      const poster = document.getElementById('m-poster').value.trim();
      const boxes = document.querySelectorAll('.easy-scene-box');

      if(!title || boxes.length === 0) return alert("Film adı ve en az 1 sahne şart!");

      let scenes = {};
      let startScene = "";

      boxes.forEach((box, i) => {
        const sName = box.querySelector('.sc-name').value.trim() || ("Sahne_" + (i+1));
        if(i === 0) startScene = sName;
        const video = box.querySelector('.sc-video').value.trim();
        const decisionTime = parseFloat(box.querySelector('.sc-dec-time').value) || 0;

        let choices = [];
        const cRows = box.querySelectorAll('.choice-row');
        cRows.forEach(row => {
          const text = row.querySelector('.c-btn-text').value.trim();
          const target = row.querySelector('.c-btn-target').value.trim();
          if(text && target) choices.push({ text, target });
        });

        scenes[sName] = { video, decisionTime, choices };
      });

      movies.push({ title, poster, startScene, scenes });
      localStorage.setItem('the_interactive_v6', JSON.stringify(movies));
      renderMovies();
      closeAdmin();
    }

    /* PLAYER SİSTEMİ */
    function startMovie(index) {
      currentMovie = movies[index];
      document.getElementById('player-title').innerText = currentMovie.title;
      historyStack = [];

      const u = getActiveUser();
      let startSceneKey = currentMovie.startScene;
      let startSec = 0;

      if(u.progress && u.progress[currentMovie.title]) {
        const p = u.progress[currentMovie.title];
        if(confirm(`"${currentMovie.title}" filmine kaldığınız yerden devam edilsin mi?`)) {
          startSceneKey = p.sceneKey; startSec = p.time; historyStack = p.history || [];
        }
      }

      document.getElementById('player-container').style.display = 'block';
      loadScene(startSceneKey, startSec);
    }

    function loadScene(sceneKey, startTime = 0) {
      currentSceneKey = sceneKey;
      const scene = currentMovie.scenes[sceneKey];
      if(!scene) return alert("Hedef sahne tanımlı değil: " + sceneKey);

      if(!historyStack.some(h => h.key === sceneKey)) historyStack.push({ key: sceneKey, title: sceneKey });

      hideChoices();
      player.src = scene.video;
      player.currentTime = startTime;
      player.play();
      document.getElementById('play-btn').innerText = '⏸';
    }

    /* PLAYER KONTROLLERİ */
    function togglePlay() {
      if(player.paused) { player.play(); document.getElementById('play-btn').innerText = '⏸'; }
      else { player.pause(); document.getElementById('play-btn').innerText = '▶'; }
    }
    function seekRelative(sec) { player.currentTime += sec; }
    function onSeek(val) { player.currentTime = (val / 100) * player.duration; }
    function toggleMute() {
      player.muted = !player.muted;
      document.getElementById('mute-btn').innerText = player.muted ? '🔇' : '🔊';
    }
    function changeVolume(val) {
      player.volume = val;
      player.muted = val == 0;
      document.getElementById('mute-btn').innerText = val == 0 ? '🔇' : '🔊';
    }
    function changeSpeed(val) { player.playbackRate = parseFloat(val); }
    function toggleFullscreen() {
      if(!document.fullscreenElement) document.getElementById('player-container').requestFullscreen();
      else document.exitFullscreen();
    }

    /* ZAMAN & KARAR TAKİBİ */
    player.ontimeupdate = () => {
      if(!player.duration) return;
      
      const pct = (player.currentTime / player.duration) * 100;
      seekbar.value = pct;
      document.getElementById('time-curr').innerText = formatTime(player.currentTime);
      document.getElementById('time-dur').innerText = formatTime(player.duration);

      // İlerleme kaydet
      const u = getActiveUser();
      if(!u.progress) u.progress = {};
      u.progress[currentMovie.title] = { sceneKey: currentSceneKey, time: player.currentTime, history: historyStack };
      localStorage.setItem('the_interactive_users', JSON.stringify(users));

      // Belirlenen kararın saniyesi geldi mi?
      const scene = currentMovie.scenes[currentSceneKey];
      const dTime = scene.decisionTime || scene.time;
      
      if(scene && dTime > 0 && player.currentTime >= dTime && !document.getElementById('choices-box').classList.contains('active')) {
        triggerChoices(scene.choices);
      }
    };

    function formatTime(sec) {
      let m = Math.floor(sec / 60);
      let s = Math.floor(sec % 60);
      return `${m < 10 ? '0' : ''}${m}:${s < 10 ? '0' : ''}${s}`;
    }

    function triggerChoices(choices) {
      if(!choices || choices.length === 0) return;
      const choicesBox = document.getElementById('choices-box');
      const btnGroup = document.getElementById('choices-btn-group');
      const timerFill = document.getElementById('timer-bar');

      btnGroup.innerHTML = choices.map(c => `
        <div class="choice-card" onclick="makeChoice('${c.target}')">${c.text}</div>
      `).join('');

      choicesBox.classList.add('active');
      timerFill.style.width = '100%';

      let start = Date.now();
      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        let el = Date.now() - start;
        let rem = Math.max(0, 100 - (el / 10000) * 100);
        timerFill.style.width = rem + '%';
        if(rem <= 0) { clearInterval(timerInterval); makeChoice(choices[0].target); }
      }, 50);
    }

    function makeChoice(target) {
      clearInterval(timerInterval);
      loadScene(target);
    }

    function hideChoices() {
      clearInterval(timerInterval);
      document.getElementById('choices-box').classList.remove('active');
    }

    /* KARAR HARİTASI */
    function openTreeMap() {
      const list = document.getElementById('tree-path-list');
      list.innerHTML = historyStack.map((node, i) => `
        <div class="tree-node" onclick="jumpToHistory(${i})">
          <div style="font-weight:700;">${i+1}. ${node.title}</div>
          <div style="font-size:11px; color:var(--text-dim);">Geri Dön ↩</div>
        </div>
      `).join('');
      document.getElementById('tree-modal').style.display = 'block';
    }
    function closeTreeMap() { document.getElementById('tree-modal').style.display = 'none'; }
    function jumpToHistory(idx) {
      const target = historyStack[idx];
      historyStack = historyStack.slice(0, idx + 1);
      closeTreeMap();
      loadScene(target.key);
    }

    function closePlayer() {
      player.pause();
      document.getElementById('player-container').style.display = 'none';
      if(document.fullscreenElement) document.exitFullscreen();
      renderMovies();
    }

    /* DIŞA / İÇE AKTAR */
    function exportData() {
      const str = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify({ movies, users }, null, 2));
      const a = document.createElement('a'); a.href = str; a.download = "InteractiveStudioData.json"; a.click();
    }
    function triggerImport() { document.getElementById('import-file').click(); }
    function importData(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (evt) => {
        try {
          const parsed = JSON.parse(evt.target.result);
          if(parsed.movies) { movies = parsed.movies; users = parsed.users || users; }
          else { movies = parsed; }
          localStorage.setItem('the_interactive_v6', JSON.stringify(movies));
          localStorage.setItem('the_interactive_users', JSON.stringify(users));
          renderMovies(); renderUsers();
          alert("Kütüphane yüklendi!");
        } catch(err) { alert("Geçersiz dosya yapısı!"); }
      };
      reader.readAsText(file);
    }

    /* KISAYOLLAR */
    window.onkeydown = (e) => {
      if(document.getElementById('player-container').style.display === 'block') {
        if(e.code === 'Space') { e.preventDefault(); togglePlay(); }
        if(e.code === 'KeyF') toggleFullscreen();
        if(e.code === 'KeyM') openTreeMap();
        if(e.code === 'ArrowLeft') seekRelative(-5);
        if(e.code === 'ArrowRight') seekRelative(5);
        if(e.code === 'Escape') closeTreeMap();
      }
    };
  </script>
</body>
</html>
